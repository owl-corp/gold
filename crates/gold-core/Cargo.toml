[package]
name = "gold-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Item parser, stat matching and trade logic"

[dependencies]
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
unicode-normalization = "0.1"
anyhow = "1"
parking_lot = "0.12"
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[lints]
workspace = true
