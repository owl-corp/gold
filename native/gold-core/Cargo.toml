[package]
name = "gold-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Item parser, stat matching and trade logic"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
unicode-normalization = "0.1"
anyhow = "1"
fancy-regex = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
