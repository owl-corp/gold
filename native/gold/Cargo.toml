[package]
name = "gold"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Wayland price check (daemon + control command)"

[dependencies]
gold-core = { path = "../gold-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
